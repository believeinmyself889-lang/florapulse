<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Growth - 3D Particle System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap');
        body { margin: 0; overflow: hidden; background: #020403; color: #fff; font-family: 'Montserrat', sans-serif; }
        canvas { display: block; }
        
        .top-nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(40px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 40px;
            justify-content: space-between;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.4s ease;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
        }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        #video-preview {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transform: scaleX(-1);
            object-fit: cover;
            opacity: 0.24;
            z-index: -1;
        }
        .status-line {
            position: absolute;
            left: 40px;
            bottom: 28px;
            z-index: 110;
            color: rgba(255,255,255,0.48);
            font-size: 10px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            pointer-events: none;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="overlay" class="fixed inset-0 flex items-center justify-center z-[200] bg-[#010101]">
        <div class="text-center">
            <h1 class="text-3xl font-light tracking-[0.4em] mb-12 opacity-60">ETHEREAL <span class="font-bold">FLORA</span></h1>
            <button id="start-btn" class="glass-btn px-16 py-5 text-sm tracking-[0.2em]">感应生命形态</button>
            <div id="loading-msg" class="mt-6 text-[10px] text-gray-800 uppercase tracking-widest hidden">正在调律自然声景...</div>
        </div>
    </div>

    <div class="top-nav">
        <div class="flex items-center gap-8">
            <div class="text-xl font-bold tracking-tighter text-white/80">EF <span class="font-light text-gray-600 text-sm">BIO</span></div>
            <label class="glass-btn flex items-center gap-2">
                <span>上传形态种子</span>
                <input type="file" id="image-upload" class="hidden" accept="image/*">
            </label>
        </div>
        <div class="flex items-center gap-10">
            <div class="flex flex-col gap-1">
                <span class="text-[9px] text-gray-500 uppercase font-semibold">粒子密度</span>
                <input type="range" id="size-slider" min="0.5" max="5" step="0.1" value="2.2" class="w-32 accent-white opacity-40 hover:opacity-100 transition">
            </div>
            <button id="mute-btn" class="glass-btn">静音</button>
            <button class="glass-btn" onclick="resetToSphere()">重置</button>
        </div>
    </div>

    <video id="video-preview" autoplay playsinline muted></video>
    <div id="status-line" class="status-line">loading default rice form</div>

    <script id="vertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uMorph;
        uniform float uSize;
        uniform float uSway; 
        uniform vec3 uDisturbPoint; // 右手拨散点
        uniform float uDisturbStrength;
        
        attribute float aRandom;
        attribute vec3 targetPosition;
        attribute vec3 targetColor;
        varying vec3 vColor;
        varying float vAlpha;

        float random (vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        void main() {
            vColor = mix(vec3(0.01), targetColor, uMorph);
            float rnd = aRandom;
            
            // 初始状态：深处沉睡的种子
            vec3 initialPos = position;
            initialPos.y = -15.0 + position.y * 0.1;
            initialPos.x += sin(uTime * 0.5 + rnd * 6.28) * 3.0 * (1.0 - uMorph);

            // 生长过渡：让不同粒子分批苏醒，避免整幅图像机械显现
            float growth = smoothstep(0.0, 1.0, uMorph);
            float birth = smoothstep(rnd * 0.34, 0.98, uMorph);
            vec3 pos = mix(initialPos, targetPosition, growth);
            
            // 拨散效果 (右手交互)
            float dist = distance(pos, uDisturbPoint);
            if(dist < 5.0) {
                float force = (1.0 - dist / 5.0) * uDisturbStrength;
                vec3 dir = normalize(pos - uDisturbPoint + vec3(0.001));
                pos += dir * force * 3.0;
            }

            // 风吹摇曳动画
            float swayX = sin(uTime * 0.4 + pos.y * 0.5 + rnd * 4.0) * 0.5 * uMorph;
            float swayZ = cos(uTime * 0.3 + pos.x * 0.5 + rnd * 3.0) * 0.3 * uMorph;
            pos.x += swayX;
            pos.z += swayZ;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = uSize * (300.0 / -mvPosition.z);
            
            // 添加深度衰减效果 - 远处的粒子更小
            float depthFactor = clamp((mvPosition.z + 20.0) / 40.0, 0.3, 1.0);
            gl_PointSize *= depthFactor;
            
            // 增强大小变化效果
            gl_PointSize *= (0.8 + 0.2 * sin(uTime * 2.0 + rnd * 10.0));
            
            // 基于生长状态的大小变化
            gl_PointSize *= (0.5 + 0.5 * uMorph);

            gl_Position = projectionMatrix * mvPosition;
            vAlpha = smoothstep(-40.0, -1.0, mvPosition.z) * (0.3 + 0.7 * uMorph) * birth;
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
            float dist = distance(gl_PointCoord, vec2(0.5));
            if (dist > 0.5) discard;
            
            // 创建更立体的粒子效果
            float strength = pow(1.0 - dist * 2.0, 2.0);
            
            // 添加光照效果 - 模拟3D光照
            vec3 lightDir = normalize(vec3(0.5, 0.5, 1.0));
            vec3 normal = normalize(vec3(gl_PointCoord - vec2(0.5), 0.8));
            float lighting = max(0.3, dot(normal, lightDir));
            
            // 添加高光效果
            float highlight = pow(max(0.0, dot(normal, lightDir)), 8.0);
            
            // 混合颜色和光照
            vec3 finalColor = vColor * lighting + vec3(highlight * 0.5);
            
            // 增强边缘发光效果
            float glow = pow(1.0 - dist * 1.5, 3.0);
            
            gl_FragColor = vec4(finalColor, (strength * 0.7 + glow * 0.3) * vAlpha);
        }
    </script>

    <script>
        let scene, camera, renderer, particles, geometry, material;
        let handsInstance = null;
        let audioCtx, masterGain, delayNode, windNoise;
        let muted = false;
        const particleCount = 30000;
        const DEFAULT_IMAGE = 'rice.png';
        const idleMorphFactor = 0.58;
        let morphFactor = 0, targetMorphFactor = idleMorphFactor;
        let disturbPoint = new THREE.Vector3(999, 999, 999);
        let pointerPoint = new THREE.Vector3(999, 999, 999);
        let disturbStrength = 0;
        let pointerStrength = 0;
        let pointerActiveUntil = 0;
        let lastHandSeen = 0;

        const FREQ_GROWTH = [110, 130.81, 146.83, 164.81, 196, 220]; // 沉稳
        const FREQ_SCATTER = [440, 523, 659, 783, 880, 1046]; // 清脆

        function updateStatus(text) {
            const el = document.getElementById('status-line');
            if (el) el.textContent = text;
        }

        function hash01(seed) {
            const x = Math.sin(seed * 12.9898) * 43758.5453123;
            return x - Math.floor(x);
        }

        function screenToWorld(clientX, clientY) {
            const x = (clientX / window.innerWidth - 0.5) * 25;
            const y = (0.5 - clientY / window.innerHeight) * 20 + 2;
            return new THREE.Vector3(x, y, 2);
        }

        function renderOnce() {
            if (!renderer || !scene || !camera || !material) return;
            material.uniforms.uMorph.value = morphFactor;
            material.uniforms.uDisturbStrength.value = disturbStrength;
            renderer.render(scene, camera);
        }

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.8, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0.0); // 透明背景
            document.body.appendChild(renderer.domElement);

            const positions = new Float32Array(particleCount * 3);
            const targets = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const randoms = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                const r = hash01(i + 1);
                const angle = hash01(i + 17) * Math.PI * 2;
                const radius = Math.sqrt(hash01(i + 31)) * 4.2;
                positions[i * 3] = Math.cos(angle) * radius;
                positions[i * 3 + 1] = -5.5 + hash01(i + 47) * 1.2;
                positions[i * 3 + 2] = Math.sin(angle) * radius * 0.35;
                randoms[i] = r;

                const phi = Math.acos(-1 + (2 * i) / particleCount);
                const theta = Math.sqrt(particleCount * Math.PI) * phi;
                targets[i * 3] = 5.0 * Math.cos(theta) * Math.sin(phi);
                targets[i * 3 + 1] = 5.0 * Math.sin(theta) * Math.sin(phi) + 1.5;
                targets[i * 3 + 2] = 5.0 * Math.cos(phi);
                
                // 增强颜色变化，创造更丰富的视觉效果
                const colorVariation = Math.random();
                if (colorVariation < 0.3) {
                    // 绿色系 - 主色调
                    colors[i * 3] = 0.05 + Math.random() * 0.15;
                    colors[i * 3 + 1] = 0.25 + Math.random() * 0.35;
                    colors[i * 3 + 2] = 0.1 + Math.random() * 0.2;
                } else if (colorVariation < 0.6) {
                    // 青蓝色系
                    colors[i * 3] = 0.1 + Math.random() * 0.2;
                    colors[i * 3 + 1] = 0.3 + Math.random() * 0.3;
                    colors[i * 3 + 2] = 0.2 + Math.random() * 0.3;
                } else {
                    // 黄绿色系
                    colors[i * 3] = 0.15 + Math.random() * 0.25;
                    colors[i * 3 + 1] = 0.35 + Math.random() * 0.25;
                    colors[i * 3 + 2] = 0.05 + Math.random() * 0.15;
                }
            }

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));
            geometry.setAttribute('targetPosition', new THREE.BufferAttribute(targets, 3));
            geometry.setAttribute('targetColor', new THREE.BufferAttribute(colors, 3));

            material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uSize: { value: 2.2 },
                    uMorph: { value: 0 },
                    uDisturbPoint: { value: disturbPoint },
                    uDisturbStrength: { value: 0 }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        async function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = muted ? 0 : 0.18;

            delayNode = audioCtx.createDelay(1.0);
            delayNode.delayTime.value = 0.5;
            const fb = audioCtx.createGain(); fb.gain.value = 0.4;
            delayNode.connect(fb); fb.connect(delayNode);
            
            masterGain.connect(audioCtx.destination);
            masterGain.connect(delayNode);
            delayNode.connect(audioCtx.destination);

            // 环境白噪声 (模拟风吹)
            const bufferSize = 2 * audioCtx.sampleRate,
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate),
                output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }
            windNoise = audioCtx.createBufferSource();
            windNoise.buffer = noiseBuffer;
            windNoise.loop = true;
            const windFilter = audioCtx.createBiquadFilter();
            windFilter.type = 'lowpass';
            windFilter.frequency.value = 400;
            const windGain = audioCtx.createGain();
            windGain.gain.value = 0.05;
            windNoise.connect(windFilter);
            windFilter.connect(windGain);
            windGain.connect(masterGain);
            windNoise.start();
        }

        function playSynth(freqs, height, type = 'sine', vol = 0.1) {
            if(!audioCtx) return;
            const idx = Math.floor((1 - height) * freqs.length);
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freqs[idx] || 220, audioCtx.currentTime);
            g.gain.setValueAtTime(0, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
            osc.connect(g); g.connect(masterGain);
            osc.start(); osc.stop(audioCtx.currentTime + 2.0);
        }

        function onResults(results) {
            disturbStrength = 0;
            disturbPoint.set(999, 999, 999);
            targetMorphFactor = idleMorphFactor;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                lastHandSeen = performance.now();
                updateStatus('hand detected · gesture mode');
                results.multiHandLandmarks.forEach((hand, idx) => {
                    const label = results.multiHandedness[idx].label; // Left or Right
                    const singleHand = results.multiHandLandmarks.length === 1;
                    
                    // 逻辑：左手控制绽放 (绽放手势)
                    if(label === 'Left' || singleHand) {
                        const d = Math.hypot(hand[4].x - hand[8].x, hand[4].y - hand[8].y);
                        targetMorphFactor = Math.min(1.0, d * 3.5);
                        if(targetMorphFactor > 0.6 && Math.random() > 0.97) {
                            playSynth(FREQ_GROWTH, hand[8].y, 'triangle', 0.08);
                        }
                    } 
                    
                    // 逻辑：双手模式下，右手控制拨散 (食指指向)
                    if(!singleHand && label === 'Right') {
                        const x = (0.5 - hand[8].x) * 25;
                        const y = (0.5 - hand[8].y) * 20 + 2;
                        disturbPoint.set(x, y, 2);
                        disturbStrength = 1.0;
                        if(Math.random() > 0.94) {
                            playSynth(FREQ_SCATTER, hand[8].y, 'sine', 0.05);
                        }
                    }
                });
            } else {
                updateStatus('idle growth · move hand or pointer');
            }
        }

        async function start() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('loading-msg').classList.remove('hidden');
            const video = document.getElementById('video-preview');
            try {
                updateStatus('requesting camera');
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                handsInstance = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
                handsInstance.setOptions({maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5});
                handsInstance.onResults(onResults);
                const camera = new Camera(video, {onFrame: async () => { if(handsInstance) await handsInstance.send({image: video}); }, width: 640, height: 480});
                camera.start();
                await initAudio();
                document.getElementById('overlay').remove();
                updateStatus('camera ready · waiting for hand');
            } catch(e) {
                await initAudio().catch(() => {});
                document.getElementById('overlay').remove();
                updateStatus('camera unavailable · pointer fallback active');
            }
        }

        function processImage(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const sampleSize = 160;
            canvas.width = sampleSize; canvas.height = sampleSize;
            ctx.clearRect(0, 0, sampleSize, sampleSize);
            const scale = Math.min(sampleSize / img.width, sampleSize / img.height);
            const drawW = img.width * scale;
            const drawH = img.height * scale;
            const drawX = (sampleSize - drawW) * 0.5;
            const drawY = (sampleSize - drawH) * 0.5;
            ctx.drawImage(img, drawX, drawY, drawW, drawH);
            const data = ctx.getImageData(0, 0, sampleSize, sampleSize).data;
            const pts = [];
            const imageWorldSize = 12.2;
            for(let i=0; i<data.length; i+=4) {
                const alpha = data[i + 3] / 255;
                const r = data[i] / 255;
                const g = data[i + 1] / 255;
                const b = data[i + 2] / 255;
                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                const saturation = max === 0 ? 0 : (max - min) / max;
                const brightness = (r + g + b) / 3;
                const isBackgroundWhite = brightness > 0.965 && saturation < 0.08;
                if(alpha > 0.28 && !isBackgroundWhite) {
                    const idx = i/4;
                    const px = idx % sampleSize;
                    const py = Math.floor(idx / sampleSize);
                    const luma = r * 0.2126 + g * 0.7152 + b * 0.0722;
                    pts.push({
                        x: (px / sampleSize - 0.5) * imageWorldSize,
                        y: (0.5 - py / sampleSize) * imageWorldSize + 1.5,
                        luma,
                        r, g, b
                    });
                }
            }
            if (pts.length === 0) {
                resetToSphere();
                updateStatus('image had no usable pixels · sphere fallback');
                return;
            }
            const tPos = new Float32Array(particleCount * 3);
            const tCol = new Float32Array(particleCount * 3);
            for(let i=0; i<particleCount; i++) {
                const p = pts[Math.floor(hash01(i + 101) * pts.length)];
                const jitterX = (hash01(i + 203) - 0.5) * 0.055;
                const jitterY = (hash01(i + 307) - 0.5) * 0.055;
                tPos[i*3] = p.x + jitterX;
                tPos[i*3+1] = p.y + jitterY;
                tPos[i*3+2] = (hash01(i + 409) - 0.5) * 0.85 + (p.luma - 0.5) * 0.32;
                tCol[i*3] = p.r; tCol[i*3+1] = p.g; tCol[i*3+2] = p.b;
            }
            geometry.attributes.targetPosition.array.set(tPos);
            geometry.attributes.targetColor.array.set(tCol);
            geometry.attributes.targetPosition.needsUpdate = true;
            geometry.attributes.targetColor.needsUpdate = true;
            targetMorphFactor = Math.max(targetMorphFactor, idleMorphFactor);
            updateStatus('botanical form loaded · gesture ready');
            if (new URLSearchParams(window.location.search).has('demo')) {
                morphFactor = Math.max(morphFactor, 0.82);
                renderOnce();
            }
        }

        function resetToSphere() {
            const t = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                const phi = Math.acos(-1 + (2 * i) / particleCount);
                const theta = Math.sqrt(particleCount * Math.PI) * phi;
                t[i * 3] = 5.0 * Math.cos(theta) * Math.sin(phi);
                t[i * 3 + 1] = 5.0 * Math.sin(theta) * Math.sin(phi) + 1.5;
                t[i * 3 + 2] = 5.0 * Math.cos(phi);
            }
            geometry.attributes.targetPosition.array.set(t);
            geometry.attributes.targetPosition.needsUpdate = true;
            targetMorphFactor = idleMorphFactor;
            updateStatus('sphere field restored');
        }

        function loadDefaultImage() {
            const img = new Image();
            img.onload = () => {
                processImage(img);
                updateStatus('default rice loaded · gesture ready');
            };
            img.onerror = () => updateStatus('default rice missing · sphere fallback');
            img.src = DEFAULT_IMAGE;
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const time = now * 0.001;
            material.uniforms.uTime.value = time;
            if (now < pointerActiveUntil && now - lastHandSeen > 700) {
                disturbPoint.copy(pointerPoint);
                disturbStrength = pointerStrength;
                targetMorphFactor = Math.max(targetMorphFactor, 0.72);
            } else if (now - lastHandSeen > 700 && disturbStrength > 0) {
                disturbStrength *= 0.92;
                if (disturbStrength < 0.02) {
                    disturbStrength = 0;
                    disturbPoint.set(999, 999, 999);
                }
            }
            // 更缓慢的插值：0.015 的系数让生长更优雅缓慢
            morphFactor += (targetMorphFactor - morphFactor) * 0.015; 
            material.uniforms.uMorph.value = morphFactor;
            material.uniforms.uDisturbStrength.value = disturbStrength;
            renderer.render(scene, camera);
        }

        function toggleMute() {
            muted = !muted;
            if (masterGain) {
                masterGain.gain.setTargetAtTime(muted ? 0 : 0.18, audioCtx.currentTime, 0.05);
            }
            document.getElementById('mute-btn').textContent = muted ? '开声' : '静音';
            updateStatus(muted ? 'sound muted' : 'sound enabled');
        }

        function activatePointer(clientX, clientY) {
            pointerPoint.copy(screenToWorld(clientX, clientY));
            pointerStrength = 0.82;
            pointerActiveUntil = performance.now() + 260;
            updateStatus('pointer fallback · botanical field responding');
        }

        function enableDemoModeIfRequested() {
            const params = new URLSearchParams(window.location.search);
            if (!params.has('demo')) return;
            setTimeout(() => {
                document.getElementById('overlay')?.remove();
                targetMorphFactor = 0.82;
                morphFactor = Math.max(morphFactor, 0.72);
                renderOnce();
                updateStatus('demo mode · pointer interaction active');
            }, 500);
        }

        document.getElementById('start-btn').onclick = start;
        document.getElementById('size-slider').oninput = (e) => material.uniforms.uSize.value = e.target.value;
        document.getElementById('mute-btn').onclick = toggleMute;
        document.getElementById('image-upload').onchange = (e) => {
            const file = e.target.files[0];
            if(file) {
                updateStatus('loading uploaded plant image');
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => processImage(img);
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        };
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        window.addEventListener('pointermove', (e) => activatePointer(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (t) activatePointer(t.clientX, t.clientY);
        }, { passive: true });
        initThree();
        loadDefaultImage();
        enableDemoModeIfRequested();
        animate();
    </script>
